<style>
:root{--navy:#17067A;--navy2:#3A2F9E;--fond:#EEF1F9;--carte:#fff;--texte:#1B1B3A;--doux:#5A5F80;--bord:#D5DAEE;--or:#B7791F;--ok:#1F7A4D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
header{background:#fff;border-bottom:4px solid var(--navy);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px}
header img{height:56px;width:auto}
header .titre{flex:1;min-width:0}
header h1{font-size:18px;margin:0;color:var(--navy)}
header .sous{font-size:12px;color:var(--doux)}
header button{background:none;border:1px solid var(--bord);color:var(--navy);border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:12px}
.carte h2{font-size:15px;color:var(--navy);margin:0 0 8px}
.etiquette{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux)}
.prochain{background:var(--navy);color:#fff;border:none}
.prochain .etiquette{color:#C9CCF0}
.prochain .grand{font-size:21px;font-weight:700;margin:4px 0}
.badge{display:inline-block;background:#fff;color:var(--navy);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.badge.urgent{background:#FFD166;color:#3B2A00}
.prochain .role{font-size:22px;font-weight:800;margin:12px 0 2px}
.prochain .detail{color:#DDE0FA}
.equipe{margin-top:12px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.equipe div{display:flex;gap:10px;padding:2px 0}
.equipe b{min-width:74px;font-weight:600;color:#C9CCF0}
.equipe .moi{color:#FFD166;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:999px;padding:10px 16px;font-size:16px;font-weight:600}
.chip.actif,.chip:active{background:var(--navy);color:#fff}
.liste button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--bord);border-radius:10px;padding:12px;margin-bottom:6px;font-size:16px;color:var(--texte)}
.liste button:active{background:var(--fond)}
.ligne{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bord)}
.ligne:last-child{border-bottom:none}
.ligne .g{font-weight:600}.ligne .d{color:var(--doux);font-size:14px}
.pastille{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--fond);color:var(--navy);white-space:nowrap;align-self:center}
.pastille.soon{background:#FFD166;color:#3B2A00;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th{background:var(--navy);color:#fff;font-weight:600;padding:8px 6px;text-align:left;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--bord);vertical-align:top}
td.moi{background:#FFF3C4;font-weight:700}
tr.passe td{opacity:.45}
.defil{overflow-x:auto;border-radius:10px;border:1px solid var(--bord)}
select,input[type=time],input[type=number]{font-size:16px;padding:9px;border:1px solid var(--bord);border-radius:8px;background:#fff;color:var(--texte);max-width:100%}
label.opt{display:flex;align-items:center;gap:10px;padding:8px 0}
label.opt input[type=checkbox]{width:22px;height:22px}
.bouton{display:block;width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:700;margin-top:10px}
.bouton:active{background:var(--navy2)}
.note{font-size:13px;color:var(--doux)}
.vide{text-align:center;color:var(--doux);padding:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bord);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:10px 2px 9px;font-size:12px;color:var(--doux)}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.actif{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--navy)}
#popup{position:fixed;inset:0;background:rgba(10,5,60,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
#popup[hidden]{display:none}
#popup .boite{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;border-top:6px solid #FFD166}
#popup h3{margin:0 0 6px;color:var(--navy);font-size:19px}
#popup .role{font-size:24px;font-weight:800;color:var(--navy);margin:10px 0 2px}
#popup ul{padding-left:18px;margin:8px 0}
footer{text-align:center;font-size:12px;color:var(--doux);padding:4px 12px 16px}
</style>
</head>

function valide(d){ return !!(d && d.dimanches && d.membres); }

/* langue : "fr" (défaut) ou "mg" ; les textes personnalisés (DATA.textes) passent avant la langue */
function langueProjet(){ var l = DATA && DATA.langue; return (l && LANGUES.textes[l]) ? l : "fr"; }   /* langue proposée par les responsables */

  var c = lire("fdl_langue_choisie", null);                                   /* choix personnel du membre : il passe avant tout */

}

var PREFS_DEFAUT = {veille:true, hVeille:"18:00", jour:true, hJour:"06:00", debut:"08:00", duree:120};

function lire(cle, defaut){ try{ var v = window.localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }catch(e){ return defaut; } }
function ecrire(cle, val){ try{ window.localStorage.setItem(cle, JSON.stringify(val)); }catch(e){} }

/* ---------- dates ---------- */
function parseDate(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function aujourdhui(){
  var m = /[?&]date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || "");   // ?date=2026-10-10 : simulation (démonstration)
  var d = m ? parseDate(m[1]) : new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function jours(date){ return Math.round((date - aujourdhui()) / 86400000); }
function fmtLong(d){ return liste("jours")[d.getDay()] + " " + d.getDate() + (d.getDate()===1 ? T("jour1") : "") + " " + liste("mois")[d.getMonth()] + " " + d.getFullYear(); }
function fmtCourt(d){ return liste("jours_courts")[d.getDay()] + " " + d.getDate() + " " + liste("mois_courts")[d.getMonth()]; }
function T(cle){
  var t = DATA && DATA.textes, v = t && t[cle];
  if(langue() === langueProjet() && typeof v === "string" && v.replace(/\s/g,"")) return v;   /* écrits dans la langue des responsables */
  var p = LANGUES.textes[langue()];
  if(p && typeof p[cle] === "string" && p[cle] !== "") return p[cle];
  var f = LANGUES.textes.fr[cle]; return typeof f === "string" ? f : cle;
}

function nomRole(i){ return ROLES[i][0] + " · " + ROLES[i][1]; }

/* ---------- données ---------- */
function groupes(){ return DATA.ordre.filter(function(g){ return DATA.membres[g]; }); }
function mesParticipations(g, nom){
  var out = [];
  DATA.dimanches.forEach(function(it){
    if(it.g.indexOf(g) < 0) return;
    var equipe = it.a[g] || [];
    var i = equipe.indexOf(nom);
    if(i < 0) return;
    out.push({iso:it.d, date:parseDate(it.d), g:g, role:i, pos:it.g.indexOf(g), tokana:it.g.length===1, equipe:equipe, groupes:it.g});
  });
  return out;
}
function moiValide(){ return etat.moi && DATA.membres[etat.moi.g] && DATA.membres[etat.moi.g].indexOf(etat.moi.n) >= 0; }

function fidirana(p){ return p.tokana ? "Fidirana tokana" : "Fidirana " + (p.pos+1) + "°"; }

/* ---------- calendrier .ics (rappels) ---------- */
function p2(n){ return (n<10?"0":"")+n; }
function fmtLocal(d){ return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00"; }
function avecHeure(date, hhmm){ var h = (hhmm||"00:00").split(":"); return new Date(date.getFullYear(), date.getMonth(), date.getDate(), +h[0]||0, +h[1]||0, 0); }
function dureeICS(min){
  if(min <= 0) return "PT0S";
  var j = Math.floor(min/1440), h = Math.floor((min%1440)/60), m = min%60;
  return "-P" + (j? j+"D":"") + "T" + (h? h+"H":"") + (m? m+"M":"");
}
function escICS(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function plier(ligne){
  var out = [], reste = ligne;
  while(reste.length > 72){ out.push(reste.slice(0,72)); reste = " " + reste.slice(72); }
  out.push(reste); return out;
}
function texteRappel(p){
  return nomRole(p.role) + " — " + fidirana(p) + " (" + p.g + ")";

function construireICS(parts, prefs, nom){
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FJKM//FDL planning//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+escICS("FDL — "+nom)];
  var stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  parts.forEach(function(p){
    var debut = avecHeure(p.date, prefs.debut), fin = new Date(debut.getTime() + (prefs.duree||120)*60000);
    var autres = p.equipe.map(function(n,i){ return n ? ROLES[i][0]+" : "+n : null; }).filter(Boolean).join("\n");
    var desc = texteRappel(p) + "\n\n" + T("equipe_titre") + "\n" + autres;
    L.push("BEGIN:VEVENT");
    L.push("UID:fdl-"+p.iso+"-"+p.g+"-"+nom.replace(/[^A-Za-z0-9]/g,"")+"@fjkm");
    L.push("DTSTAMP:"+stamp);
    L.push("DTSTART:"+fmtLocal(debut));
    L.push("DTEND:"+fmtLocal(fin));
    L.push("SUMMARY:"+escICS("FDL — "+ROLES[p.role][0]+" ("+p.g+")"));
    L.push("DESCRIPTION:"+escICS(desc));
    L.push("TRANSP:TRANSPARENT");
    if(prefs.veille){
      var av = avecHeure(new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate()-1), prefs.hVeille);
      var mv = Math.round((debut - av)/60000);
      if(mv > 0){ L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escICS(T("demain")+" : "+texteRappel(p)),"TRIGGER:"+dureeICS(mv),"END:VALARM"); }
    }
    if(prefs.jour){
      var aj = avecHeure(p.date, prefs.hJour);
      var mj = Math.round((debut - aj)/60000);
      if(mj > 0){ L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escICS(T("aujourdhui")+" : "+texteRappel(p)),"TRIGGER:"+dureeICS(mj),"END:VALARM"); }
    }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  var plie = []; L.forEach(function(l){ plier(l).forEach(function(x){ plie.push(x); }); });
  return plie.join("\r\n") + "\r\n";
}
/* ---------- mise à jour automatique par internet ---------- */
var jetons = {}, jetonN = 0;
window.__retourReseau = function(j, corps){ var f = jetons[j]; if(f){ delete jetons[j]; f(corps); } };
function telecharger(url){
  return new Promise(function(resolve, reject){
    var delai = setTimeout(function(){ reject(new Error("délai dépassé")); }, 15000);
    if(EN_APP && window.AndroidFDL.telecharger){
      var j = ++jetonN;
      jetons[j] = function(corps){ clearTimeout(delai); if(corps){ resolve(corps); } else { reject(new Error("réseau")); } };
      window.AndroidFDL.telecharger(url, j);
    } else if(typeof fetch === "function"){
      fetch(url, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.text(); })
        .then(function(t){ clearTimeout(delai); resolve(t); }).catch(function(e){ clearTimeout(delai); reject(e); });
    } else { clearTimeout(delai); reject(new Error("pas de réseau")); }
  });
}
function appliquerMaj(d, txt){
  if(!d.source && DATA.source){ d.source = DATA.source; txt = JSON.stringify(d); }   /* on garde l'adresse si la nouvelle version ne la contient pas */
  DATA = d;
  try{
    if(EN_APP){ if(window.AndroidFDL.enregistrerProgramme) window.AndroidFDL.enregistrerProgramme(txt); }
    else { ecrire("fdl_data", d); }
  }catch(e){}
  effacer("fdl_pin");
  etat.dimanche = null;
  render();
}
function epingleActif(){
  /* fichier chargé à la main dans l'application : conservé tant qu'aucune NOUVELLE publication n'arrive */
  try{
    if(EN_APP && window.AndroidFDL.importManuel){
      var st = window.AndroidFDL.importManuel();
      if(!st){ effacer("fdl_pin"); }
      else if(st !== lire("fdl_pin_vu", "")){ ecrire("fdl_pin_vu", st); ecrire("fdl_pin", {base:null}); }
    }
  }catch(e){}
  return lire("fdl_pin", null);
}
function verifierMaj(manuel, forcer){
  var url = DATA.source || "";
  if(!/^https:\/\//.test(url)) return Promise.resolve("sans-source");
  if(!manuel && Date.now() - lire("fdl_verif", 0) < 10*60*1000) return Promise.resolve("recent");
  ecrire("fdl_verif", Date.now());
  return telecharger(url + (url.indexOf("?")<0 ? "?" : "&") + "t=" + Date.now()).then(function(txt){
    var d = JSON.parse(txt);
    if(!valide(d)) throw new Error("fichier non valide");
    etat.enLigne = {maj: d.maj || "", periode: d.periode || ""};
    var m1 = d.maj || "", m0 = DATA.maj || "";
    if(m1 === m0 && (d.periode || "") === (DATA.periode || "")) return "a-jour";
    if(!forcer){
      var pin = epingleActif();
      if(pin){
        /* 1re vérification après un chargement manuel : une version en ligne PLUS RÉCENTE que le fichier chargé
           est une publication faite après lui -> elle fait foi ; sinon elle est considérée comme l'ancienne version en ligne */
        if(pin.base === null && m1 <= m0){ pin.base = m1; ecrire("fdl_pin", pin); return "epingle"; }
        if(pin.base !== null && m1 === pin.base) return "epingle";
      }
    }
    appliquerMaj(d, txt);          /* publié en ligne et différent de ce que j'ai : il fait foi, même s'il est plus ancien */
    return "nouveau";
  }).catch(function(){ return "hors-ligne"; });
}

function rappelsNatifs(parts, prefs, now){
  var out = [], maintenant = now || Date.now();
  parts.forEach(function(p){
    var jour = Math.floor(Date.UTC(p.date.getFullYear(), p.date.getMonth(), p.date.getDate()) / 86400000);
    var avec = p.equipe.map(function(n,i){ return (n && i!==p.role) ? ROLES[i][0]+" : "+n : null; }).filter(Boolean).join(" · ");
    var corps = fmtLong(p.date) + "\n" + ROLES[p.role][0] + " · " + ROLES[p.role][1] + " — " + fidirana(p) + " (" + p.g + ")" + (avec ? "\n" + T("avec_mot") + " " + avec : "");
    if(prefs.veille){
      var a = avecHeure(new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate()-1), prefs.hVeille).getTime();
      if(a > maintenant) out.push({id: jour*10+1, at: a, titre: T("demain") + " : " + ROLES[p.role][0] + " (" + p.g + ")", texte: corps});
    }
    if(prefs.jour){
      var b = avecHeure(p.date, prefs.hJour).getTime();
      if(b > maintenant) out.push({id: jour*10+2, at: b, titre: T("aujourdhui") + " : " + ROLES[p.role][0] + " (" + p.g + ")", texte: corps});
    }
  });
  return out;
}
function programmerNatifs(){
  if(!EN_APP) return 0;
  var liste = moiValide() ? rappelsNatifs(partsMoi().filter(function(p){ return jours(p.date) >= 0; }), etat.prefs) : [];
  try{ window.AndroidFDL.programmerRappels(JSON.stringify(liste)); }catch(e){}
  return liste.length;
}
function telechargerICS(){
  var futures = partsMoi().filter(function(p){ return jours(p.date) >= 0; });
  if(!futures.length){ alert(T("aucune_part")); return; }
  var txt = construireICS(futures, etat.prefs, etat.moi.n);
  var blob = new Blob([txt], {type:"text/calendar;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "FDL_" + etat.moi.n.replace(/[^A-Za-z0-9]/g,"_") + ".ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

  });
  var bi = document.getElementById("btnICS"); if(bi) bi.onclick = function(){ maj(); telechargerICS(); };
  var bm = document.getElementById("btnImport"); if(bm) bm.onclick = function(){ window.AndroidFDL.importerProgramme(); };
  var bu = document.getElementById("btnMaj"); if(bu) bu.onclick = function(){ lancerMaj(true); };
  var bf = document.getElementById("btnForcer"); if(bf) bf.onclick = function(){ lancerMaj(true, true); };
}

function popupRappel(){
  if(!moiValide()) return;
  var p = partsMoi().filter(function(x){ return jours(x.date) >= 0; })[0];
  if(!p) return;
  var n = jours(p.date), cle = "popup_" + p.iso + "_" + n;
  if(n > 1 || lireSession(cle)) return;
  ecrireSession(cle);
  var pop = document.getElementById("popup");
  var h = '<div class="boite"><h3>🔔 '+esc(n===0 ? T("popup_aujourdhui") : T("popup_demain"))+'</h3>';
  h += '<div>'+esc(fmtLong(p.date))+'</div><div class="role">'+esc(ROLES[p.role][0])+' · '+esc(ROLES[p.role][1])+'</div>';
  h += '<div class="note">Groupe '+esc(p.g)+' · '+esc(fidirana(p))+'</div><ul>';
  p.equipe.forEach(function(nom,i){ if(nom && i!==p.role) h += '<li>'+esc(ROLES[i][0])+' : '+esc(nom)+'</li>'; });
  h += '</ul><button class="bouton" id="popOk">'+esc(T("popup_ok"))+'</button></div>';
  pop.innerHTML = h; pop.hidden = false;
  document.getElementById("popOk").onclick = function(){ pop.hidden = true; };
}

document.getElementById("btnChanger").onclick = function(){ effacer("fdl_moi"); etat.moi = null; etat.choixGroupe = null; render(); };

window.FDL = {DATA:DATA, etat:etat, mesParticipations:mesParticipations, construireICS:construireICS, dureeICS:dureeICS, render:render, popupRappel:popupRappel, jours:jours, rappelsNatifs:rappelsNatifs, programmerNatifs:programmerNatifs, EN_APP:EN_APP, verifierMaj:verifierMaj, lancerMaj:lancerMaj, getData:function(){ return DATA; }};
render();
popupRappel();
lancerMaj(false);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") lancerMaj(false); });
})();
</script>
</body>
